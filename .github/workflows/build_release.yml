name: Build and Release Hecato

on:
  push:
    tags:
      - "v*.*.*" # This triggers the workflow on version tags like v1.0.0
  workflow_dispatch: # Manual run builds and uploads artifacts, but publishes nothing

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to publish the release; nothing else is granted

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Needed so `git describe` in the Makefile can see tags

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # Single source of truth: the go directive in go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: make release

      - name: Archive build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hecato-binaries
          path: |
            hecato
            hecato.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            hecato hecato.exe \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
