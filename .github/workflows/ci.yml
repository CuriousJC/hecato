name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The walk is a worker pool, so the race detector is the check that
      # matters most here. It needs cgo and a C compiler, which the Linux
      # runner has and a stock Windows dev box does not -- so this is the only
      # place it reliably runs.
      - name: Test with the race detector
        run: go test -race ./...

      - name: Build both targets
        run: make all
